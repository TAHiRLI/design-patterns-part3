plugins {
    id 'application'
    id 'java'
}

group = 'com.designpatterns'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.designpatterns.day03.Day03Demo'
}

tasks.register('runStrategy', JavaExec) {
    group = 'application'
    description = 'Run Strategy demo'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.designpatterns.day03.strategy.StrategyDemo'
}

tasks.register('runTemplateMethod', JavaExec) {
    group = 'application'
    description = 'Run Template Method demo'
    classpath = sourceSets.main.runtimeClasspath
